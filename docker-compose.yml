services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: geohealth-db
    environment:
      POSTGRES_USER: geo_user
      POSTGRES_PASSWORD: geo_password
      POSTGRES_DB: geohealth
    ports:
      - "5432:5432"
    volumes:
      - pgdata_geohealth:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_user -d geohealth"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_geohealth: